[package]
name = "pherielium"
version = "1.0.4"
description = "Pherielium Game Hub — Tauri edition with Rust backend"
authors = ["Guilherme Sant'Ana"]
edition = "2021"

[lib]
name = "pherielium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri Core ────────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# ── Tauri Plugins ─────────────────────────────────────────────────────────────
tauri-plugin-opener       = "2"
tauri-plugin-shell        = "2"
tauri-plugin-fs           = "2"
tauri-plugin-dialog       = "2"
tauri-plugin-notification = "2"
tauri-plugin-store        = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os           = "2"
tauri-plugin-http         = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-updater      = "2"
tauri-plugin-process      = "2"
# nxm:// (links "Mod Manager Download" da Nexus) e instância única, para o link cair no app já aberto
tauri-plugin-deep-link    = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── HTTP client ───────────────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"] }

# ── Serialização ──────────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── SQLite (game library local) ───────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"] }

# ── UUID ──────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }

# ── Criptografia / Credential Store ──────────────────────────────────────────
# windows-native é obrigatório: sem uma feature de plataforma o keyring 3 cai no repositório
# "mock" (só em memória), e a chave da Nexus nunca é gravada de verdade.
keyring = { version = "3", features = ["windows-native"] }
base64  = "0.22"

# ── Process / System Info ────────────────────────────────────────────────────
sysinfo = "0.32"

# ── Arquivos ZIP (Nexus mod installer) ───────────────────────────────────────
zip = "2"
# 7z (comum na Nexus): só descompressão e sem senha; LZMA/LZMA2 vêm sempre, o resto é opt-in
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "deflate"] }

# ── Regex ─────────────────────────────────────────────────────────────────────
regex = "1"
sha2  = "0.10"

# ── Paths ─────────────────────────────────────────────────────────────────────
dirs = "5"

# ── Logging ───────────────────────────────────────────────────────────────────
log = "0.4"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow = "1"
thiserror = "1"

# ── Overlay & Captures ────────────────────────────────────────────────────────
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
once_cell   = "1"
open        = "5"

# ── Windows-specific APIs ─────────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
winreg  = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Security", # CreateEventW (captura de áudio orientada a evento)
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
] }

# Gamepad virtual: fala com o driver ViGEmBus, que o usuário instala à parte.
# Pure Rust, sem SDK em C++.
vigem-client = "0.1.4"
# Bateria real de DualSense/DualShock 4 (relatório HID de entrada)
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

# ── Features opcionais ───────────────────────────────────────────────────────
[features]
# Habilita o DevTools (F12) no build de release. Só para builds de teste (rc); o instalador oficial NÃO usa.
# Uso: npm run tauri build -- --features devtools   (docs/release-rc.md)
devtools = ["tauri/devtools"]

# ── Build optimizations ──────────────────────────────────────────────────────
[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true

[profile.dev]
incremental = true

[dev-dependencies]
# o escritor de 7z só existe nos testes (para criar arquivos de exemplo)
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
